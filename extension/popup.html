<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Subster usage</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; width: 320px; padding: 16px; background: #030407; color: #f3f5f7; font: 13px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
      h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .sub { margin: 2px 0 14px; color: #9aa1ad; font-size: 12px; }
      .label { margin: 14px 0 6px; color: #6b7280; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; }
      ul { margin: 0; padding: 0; list-style: none; border: 1px solid #1b1f28; border-radius: 10px; }
      li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border-top: 1px solid #1b1f28; }
      li:first-child { border-top: 0; }
      li.now .name::after { content: "counting"; margin-left: 8px; color: #d4ff24; font-size: 11px; }
      .num { font-variant-numeric: tabular-nums; color: #9aa1ad; }
      .empty { padding: 10px; color: #9aa1ad; }
      .row { display: flex; gap: 8px; }
      input { flex: 1; min-width: 0; padding: 7px 9px; border: 1px solid #1b1f28; border-radius: 8px; background: #0a0c11; color: inherit; font: inherit; }
      input:focus-visible, button:focus-visible { outline: 2px solid #1558c9; outline-offset: 1px; }
      button { padding: 7px 11px; border: 0; border-radius: 8px; background: #d4ff24; color: #030407; font: inherit; font-weight: 600; cursor: pointer; }
      button.quiet { border: 1px solid #1b1f28; background: transparent; color: #f3f5f7; font-weight: 500; }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { margin: 10px 0 0; font-size: 12px; color: #9aa1ad; overflow-wrap: anywhere; }
      #status.bad { color: #ff7a7a; }
      .foot { margin: 12px 0 0; color: #6b7280; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>Subster usage</h1>
    <p class="sub">Time on the sites of subscriptions you track.</p>

    <div class="label">Today</div>
    <ul id="sites"></ul>

    <div class="label">Subster server</div>
    <form id="server" class="row">
      <input id="url" type="url" required spellcheck="false" aria-label="Subster server address" />
      <button type="submit" class="quiet">Save</button>
    </form>
    <div class="row" style="margin-top: 8px">
      <button id="sync" type="button">Sync now</button>
    </div>
    <p id="status" role="status"></p>
    <p class="foot">Only daily totals per subscription leave this browser. No page addresses, titles or content.</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
