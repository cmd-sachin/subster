openapi: 3.0.3
info:
  title: Subster Assistant API
  version: 1.0.0
  description: >
    Conversations with the Subster agent. The server keeps every conversation, with the steps,
    components and proposals each reply showed, so a client sends only the new message and the
    agent answers with the context of what was already said. Import this file into APIMatic to
    generate SDKs and a developer portal.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Sessions
    description: Conversations and their history
  - name: Messages
    description: Talking to the agent inside a conversation
  - name: Approvals
    description: Deciding the proposals the agent makes
paths:
  /api/chat/sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List conversations, newest first
      responses:
        '200':
          description: The conversations
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/SessionSummary' }
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Start a conversation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 80 }
      responses:
        '201':
          description: The new, empty conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
  /api/chat/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Read a conversation with its full history
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Sessions]
      operationId: renameSession
      summary: Rename a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200':
          description: The renamed conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Sessions]
      operationId: deleteSession
      summary: Delete a conversation
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/chat/sessions/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Messages]
      operationId: sendMessage
      summary: Send a message and stream the agent's reply
      description: >
        The reply is newline-delimited JSON, one event a line. The server gives the agent the
        conversation so far from its own record; the caller sends only the new message. Both turns
        are stored with the conversation when the stream ends.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, maxLength: 2000 }
                mode:
                  type: string
                  enum: [chat, sweep]
                  default: chat
                  description: sweep runs a full audit; the message is then optional.
      responses:
        '200':
          description: A stream of events
          content:
            application/x-ndjson:
              schema: { $ref: '#/components/schemas/StreamEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/actions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: The proposal's id, from a step's actionId
    post:
      tags: [Approvals]
      operationId: decideAction
      summary: Approve or decline a proposal
      description: >
        Approval is the only way a proposal becomes a real change. For a PayPal-managed agreement
        the change is made through PayPal and read back to confirm it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject, done]
      responses:
        '200':
          description: The application state after the decision
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: No such conversation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: The request could not be used
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    SessionSummary:
      type: object
      required: [id, title, createdAt, updatedAt, messages, preview]
      properties:
        id: { type: string }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        messages: { type: integer }
        preview: { type: string }
    Session:
      type: object
      required: [id, title, createdAt, updatedAt, turns]
      properties:
        id: { type: string }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        turns:
          type: array
          items: { $ref: '#/components/schemas/Turn' }
    Turn:
      type: object
      required: [role, content, at]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, description: Markdown for an assistant turn }
        at: { type: string, format: date-time }
        mode: { type: string, enum: [chat, sweep], description: User turns only }
        steps:
          type: array
          description: Assistant turns only. What the agent did, in order.
          items: { $ref: '#/components/schemas/Step' }
        error: { type: string }
    Step:
      type: object
      required: [at, kind, title]
      properties:
        at: { type: string, format: date-time }
        kind: { type: string, enum: [tool, thought, action, final] }
        tool: { type: string }
        title: { type: string }
        detail: { type: string }
        actionId: { type: string, description: The proposal this step created, to show for approval }
        widget: { $ref: '#/components/schemas/Widget' }
    Widget:
      type: object
      required: [type, items]
      properties:
        type: { type: string, enum: [progress, stats, choices, checklist, confirm, subscriptions, table] }
        title: { type: string }
        note: { type: string }
        items:
          type: array
          items:
            type: object
            required: [label]
            properties:
              label: { type: string }
              value: { type: number }
              max: { type: number }
              text: { type: string }
              detail: { type: string }
              tone: { type: string, enum: [good, warn, bad] }
              subscriptionId: { type: string }
              send: { type: string }
              checked: { type: boolean }
        columns: { type: array, items: { type: string } }
        rows: { type: array, items: { type: array, items: { type: string } } }
        confirmLabel: { type: string }
        prompt: { type: string }
    StreamEvent:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [step, text, error, done] }
        step: { $ref: '#/components/schemas/Step' }
        text: { type: string }
        message: { type: string }
        runId: { type: string }
        summary: { type: string }
